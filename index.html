<style>
/* Layout: app de una pantalla para celular. Fondo degradé violeta → azul → turquesa con manchas de luz que se mueven.
   Estilo caricatura: todo lo tocable tiene contorno tinta y sombra sólida, como el logo y Tito. Los 4 colores de marca marcan secciones. */
:root{
  --g:#22A447; --r:#EE3B2B; --y:#FFC425; --b:#2F7FE8;
  --g-soft:#E2F5E7; --r-soft:#FDE7E4; --y-soft:#FFF4D2; --b-soft:#E3EEFD;
  --bg1:#3B2C9E; --bg2:#1F4DB0; --bg3:#0D8197;
  --on-bg:#FFFFFF; --on-bg-muted:rgba(255,255,255,.82);
  --surface:#FFFFFF; --surface-2:#F2F4FA; --ink:#151A35; --muted:#5B6283; --line:#E0E3F0;
  --K:#0B0F24; --gold1:#FFE9A3; --gold2:#F2B705; --gold3:#B37A00;
  --correct:#22A447; --present:#E3A600; --absent:#7A819E; --tile-line:#CDD2E3;
  --ad:#FFF5D1; --ad-line:#E1CB78; --ad-ink:#5B4A0C;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --cartoon:"Luckiest Guy", "Arial Black", Impact, sans-serif;
  --rad:22px; --bw:2.5px; --pop:0 5px 0 var(--K);
  --fs:17px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --g-soft:#173826; --r-soft:#3D1D1A; --y-soft:#3A3013; --b-soft:#18294A;
    --bg1:#22195E; --bg2:#122E6B; --bg3:#08505E;
    --surface:#1A2040; --surface-2:#232A50; --ink:#ECEFFB; --muted:#A9AFCD; --line:#2E3660;
    --absent:#4A5070; --tile-line:#3A4270; --ad:#2A2510; --ad-line:#5A4E1E; --ad-ink:#E9D98F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --g-soft:#173826; --r-soft:#3D1D1A; --y-soft:#3A3013; --b-soft:#18294A;
  --bg1:#22195E; --bg2:#122E6B; --bg3:#08505E;
  --surface:#1A2040; --surface-2:#232A50; --ink:#ECEFFB; --muted:#A9AFCD; --line:#2E3660;
  --absent:#4A5070; --tile-line:#3A4270; --ad:#2A2510; --ad-line:#5A4E1E; --ad-ink:#E9D98F;
  color-scheme:dark;
}
:root.big{--fs:19px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;background-color:var(--bg2);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 20% 25%,rgba(167,120,255,.35),transparent 30%),radial-gradient(circle at 85% 70%,rgba(40,220,210,.28),transparent 32%),radial-gradient(circle at 60% 10%,rgba(80,150,255,.25),transparent 28%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(6deg)}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85em} .num{font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
header.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px;position:relative;z-index:2}
.brand{--k:1;display:inline-flex;align-items:baseline;line-height:1;white-space:nowrap;user-select:none}
.brand.lg{--k:1.45} .brand.xl{--k:2.1}
.brand .unra{font-family:var(--display);font-weight:700;font-size:calc(var(--k)*26px);color:#FFFFFF;margin-right:calc(var(--k)*2px)}
.brand .tito{display:inline-flex;align-items:flex-end}
.brand .tito span{display:inline-block;font-family:var(--cartoon);color:var(--c);-webkit-text-stroke:calc(var(--k)*3px) var(--K);paint-order:stroke fill;text-shadow:0 calc(var(--k)*3px) 0 var(--K);transform:rotate(var(--rt)) translateY(calc(var(--k)*var(--dy)));font-size:calc(var(--k)*var(--s));margin-right:-1px}
.coins{margin-left:auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 14px 5px 7px;font-weight:800;font-size:1.22em}
.coins.bump{animation:cbump .45s ease}
@keyframes cbump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.coins b{font-family:var(--cartoon);font-weight:400;font-size:1.05em;letter-spacing:.02em;color:var(--y);-webkit-text-stroke:2px var(--K);paint-order:stroke fill}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3B0,#F2B705 60%,#B37A00);border:2px solid var(--K);vertical-align:-.15em;flex:none}
.gear{width:42px;height:42px;border-radius:13px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;padding:0}
.gear svg{width:22px;height:22px}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px 28px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
main > *{flex-shrink:0}
main.enter > *{animation:rise .42s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:var(--bw) solid var(--K);border-radius:var(--rad);padding:16px;box-shadow:var(--pop)}
.eyebrow{font-size:.74em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.page-head{display:flex;flex-direction:column;gap:4px;color:var(--on-bg)}
.page-head .eyebrow{color:var(--on-bg-muted)}
.page-head h1{font-size:1.7em}
.page-head p{color:var(--on-bg-muted)}
.stripe4{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--g) 0 25%,var(--r) 25% 50%,var(--y) 50% 75%,var(--b) 75% 100%)}

/* Tocables con rebote */
.press{transition:transform .12s ease, box-shadow .12s ease}
.press:active{transform:translateY(3px) scale(.985);box-shadow:0 2px 0 var(--K)}
.btn{border:var(--bw) solid var(--K);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;box-shadow:0 4px 0 var(--K);transition:transform .12s ease, box-shadow .12s ease}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--K)}
.btn.primary{background:var(--b);color:#fff}
.btn.green{background:var(--g);color:#fff}
.btn.red{background:var(--r);color:#fff}
.btn.yellow{background:var(--y);color:var(--K)}
.btn.reward{background:var(--ad);color:var(--ad-ink)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:none}
.btn.gold{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#3A2600}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn svg{width:22px;height:22px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.big-cta{font-family:var(--cartoon);font-weight:400;font-size:1.55em;letter-spacing:.04em;min-height:68px;border-radius:22px;background:var(--y);color:var(--K);box-shadow:0 6px 0 var(--K);animation:breathe 2.4s ease-in-out infinite}
.big-cta:active{animation:none}
@keyframes breathe{50%{transform:scale(1.03)}}

/* Iconos */
.ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--c);border:var(--bw) solid var(--K);flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.ico svg{width:42px;height:42px;display:block}
.ico.sm{width:46px;height:46px;border-radius:14px}
.ico.sm svg{width:32px;height:32px}

/* Inicio */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-align:center;padding-top:4px}
.stage{position:relative;width:210px;height:200px;display:grid;place-items:center}
.stage::before{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.38),rgba(255,255,255,.06) 62%,transparent 70%);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.06);opacity:.8}}
.stage .tap{position:relative;border:0;background:none;padding:0}
.bubble{position:relative;background:#fff;color:var(--K);border:var(--bw) solid var(--K);border-radius:16px;padding:8px 14px;font-weight:800;max-width:86%;text-align:center;box-shadow:0 4px 0 var(--K);animation:pop .35s cubic-bezier(.2,.9,.3,1.4) both}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:13px;height:13px;background:#fff;border-right:var(--bw) solid var(--K);border-bottom:var(--bw) solid var(--K);transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.hero .who{font-family:var(--display);font-size:1.15em;font-weight:600;display:flex;gap:6px;align-items:center}
.streak{display:flex;flex-direction:column;gap:12px}
.streak-top{display:flex;align-items:center;gap:12px}
.flame{width:52px;height:52px;flex:none}
.cartoon-num{font-family:var(--cartoon);font-size:2.4em;line-height:1;color:var(--c,var(--r));-webkit-text-stroke:3px var(--K);paint-order:stroke fill;text-shadow:0 3px 0 var(--K)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.streak-row{display:flex;align-items:center;gap:10px}
.streak-row .flame{width:44px;height:44px}
.streak-row .gift-note{margin-left:auto;font-size:.78em;font-weight:800;color:var(--muted);text-align:right;line-height:1.2}
.day-dot{aspect-ratio:1/1;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:.8em;color:var(--muted);position:relative}
.day-dot.on{background:var(--r);border-color:var(--K);color:#fff}
.day-dot.today{border-color:var(--K);border-style:dashed}
.day-dot svg{width:70%;height:70%}
.perk{font-size:.76em;font-weight:700;color:var(--muted);text-align:center}
.perk b{color:var(--ink)}
.status-line{color:var(--on-bg-muted);text-align:center;font-weight:700;font-size:.9em}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font-weight:800;font-size:.75em;padding:0}

/* Lista de juegos */
.game{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.game h2{font-size:1.18em}
.game p{color:var(--muted);font-size:.88em}
.go{font-weight:800;font-size:.85em;padding:8px 13px;border-radius:12px;background:var(--c,var(--b));color:#fff;white-space:nowrap;border:2px solid var(--K)}
.go.y{color:var(--K)}
.go.done{background:var(--g-soft);color:var(--g);border-color:var(--g)}
.go.lost{background:var(--r-soft);color:var(--r);border-color:var(--r)}
.note{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;border:2px solid rgba(255,255,255,.35)}
.note button{border:2px solid var(--K);background:var(--y);color:var(--K);font-weight:800;padding:6px 12px;border-radius:10px}

/* Banner de anuncio y barra de pestañas */
.ad-banner{margin:0 10px 6px;height:54px;border:2px dashed var(--ad-line);background:var(--ad);color:var(--ad-ink);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:.8em;position:relative;z-index:2}
.ad-tag{font-size:.75em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid currentColor;border-radius:4px;padding:1px 5px;flex:none}
.ad-banner button{margin-left:auto;white-space:nowrap;border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;padding:4px}
.app.noads .ad-banner, .app.playing .ad-banner{display:none}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:var(--bw) solid var(--K);border-radius:24px 24px 0 0;padding:6px 2px calc(env(safe-area-inset-bottom) + 4px);position:relative;z-index:2}
nav.tabs button{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7em;width:100%;font-weight:800;color:var(--muted);min-width:0}
nav.tabs .ti{width:56px;height:40px;border-radius:14px;display:grid;place-items:center;transition:transform .2s}
nav.tabs .ti svg{width:33px;height:33px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ti{background:var(--c);border:2px solid var(--K);animation:tabpop .35s cubic-bezier(.2,.9,.3,1.6)}
@keyframes tabpop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.app.playing nav.tabs{display:none}

/* Juego */
.play-head{display:flex;align-items:center;gap:10px;color:#fff}
.play-head h1{font-size:1.25em;flex:1;min-width:0}
.icon-btn{width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:22px;height:22px}
.sheet .icon-btn{border-color:var(--K);background:var(--surface-2);color:var(--ink)}
.hint-btn{border:var(--bw) solid var(--K);background:var(--y);color:var(--K);border-radius:14px;padding:7px 12px;font-weight:800;font-size:.85em;white-space:nowrap;min-height:46px;box-shadow:0 3px 0 var(--K)}
.hint-btn:disabled{opacity:.45;box-shadow:none}
.group-tag{display:inline-flex;gap:6px;align-items:center;background:var(--y);color:var(--K);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.78em;border:2px solid var(--K)}
.msg{min-height:1.4em;text-align:center;font-weight:800;color:#fff}
.msg.bad{color:#FFD1CC} .msg.ok{color:#C9F7D6}
.tbar-wrap{display:flex;align-items:center;gap:10px}
.tito-mini{width:52px;flex:none;display:flex;justify-content:center}
.tito-mini svg{display:block}
.tbar{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;border:var(--bw) solid var(--K)}
.tbar span{display:block;height:100%;background:var(--g);transition:width .25s linear}
.tbar.mid span{background:var(--y)} .tbar.low span{background:var(--r);animation:blinkbar .5s steps(2) infinite}
@keyframes blinkbar{50%{opacity:.6}}
.tsec{font-family:var(--cartoon);color:#fff;-webkit-text-stroke:2px var(--K);paint-order:stroke fill;min-width:3.2em;text-align:right;font-size:1.3em;font-variant-numeric:tabular-nums}
.start-card{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.start-card .big{font-family:var(--cartoon);font-size:2.6em;color:var(--y);-webkit-text-stroke:3px var(--K);paint-order:stroke fill;text-shadow:0 3px 0 var(--K);line-height:1}
.board{display:grid;gap:6px;margin:0 auto;width:min(100%, 330px)}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wrow.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tile{aspect-ratio:1/1;border:var(--bw) solid var(--tile-line);border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.75em;text-transform:uppercase;background:var(--surface);color:var(--ink)}
.tile.filled{border-color:var(--K);animation:tpop .12s}
@keyframes tpop{50%{transform:scale(1.08)}}
.tile.correct,.tile.present,.tile.absent{border-color:var(--K);color:#fff;animation:flip .5s both;animation-delay:calc(var(--j)*90ms)}
.tile.correct{background:var(--correct)} .tile.present{background:var(--present)} .tile.absent{background:var(--absent)}
.wrow.old .tile{animation:none}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
.tile.hinted{box-shadow:inset 0 0 0 3px var(--y)}
.kb{display:flex;flex-direction:column;gap:7px;margin-top:4px;user-select:none}
.kb-row{display:flex;gap:5px;justify-content:center}
.key{flex:1;min-width:0;height:56px;border:2px solid var(--K);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:800;font-size:1.05em;padding:0;text-transform:uppercase;box-shadow:0 3px 0 var(--K);transition:transform .08s}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--K)}
.key.wide{flex:1.6;font-size:.72em}
.key.correct{background:var(--correct);color:#fff} .key.present{background:var(--present);color:#fff} .key.absent{background:var(--absent);color:#fff}
.hint-line{text-align:center;font-weight:800;color:var(--K);background:var(--y);border-radius:12px;padding:6px 10px;border:2px solid var(--K)}
.grid-wrap{touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto;width:min(100%, 440px)}
.sgrid{display:grid;gap:2px;background:var(--surface);border-radius:18px;padding:6px;border:var(--bw) solid var(--K);box-shadow:var(--pop)}
.scell{aspect-ratio:1/1;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.02em;border-radius:8px;color:var(--ink);transition:background .12s}
.scell.sel{background:var(--y);color:var(--K);transform:scale(1.08)}
.scell.got{animation:tpop .3s}
.scell.flash{animation:flash 1.2s 2}
@keyframes flash{50%{background:var(--r);color:#fff}}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{padding:6px 11px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:800;font-size:.82em;letter-spacing:.03em;border:2px solid var(--K)}
.word.found{text-decoration:line-through;color:#fff;animation:tpop .3s}
.q-card h2{font-size:1.28em;line-height:1.3;margin-top:6px}
.qcat{display:inline-block;font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:999px;background:var(--b-soft);color:var(--b);border:1.5px solid currentColor}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{text-align:left;border:var(--bw) solid var(--K);background:var(--surface);color:var(--ink);border-radius:16px;padding:13px 16px;font-weight:700;min-height:56px;box-shadow:0 4px 0 var(--K);transition:transform .1s, box-shadow .1s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--K)}
.opt:disabled{cursor:default}
.opt.right{background:var(--g);color:#fff;animation:tpop .35s}
.opt.wrong{background:var(--r);color:#fff;animation:shake .4s}
.opt.gone{opacity:.25;text-decoration:line-through;box-shadow:none}
.qdots{display:flex;gap:6px}
.qdots i{flex:1;max-width:44px;height:9px;border-radius:5px;background:rgba(255,255,255,.3);border:1.5px solid rgba(11,15,36,.4)}
.qdots i.ok{background:var(--g)} .qdots i.no{background:var(--r)} .qdots i.cur{background:var(--y)}
.clues{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.clue{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-weight:700;border-left:5px solid var(--b);animation:rise .35s both}
.visual{display:flex;justify-content:center;margin:6px 0 2px}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .big{font-family:var(--display);font-weight:700;font-size:2.1em;line-height:1.1}
.pts-badge{font-family:var(--cartoon);font-size:1.6em;color:var(--y);-webkit-text-stroke:3px var(--K);paint-order:stroke fill;text-shadow:0 3px 0 var(--K);animation:pop .5s cubic-bezier(.2,.9,.3,1.6) both .2s}
.share-box{font-family:ui-monospace,Menlo,monospace;font-size:.85em;white-space:pre;background:var(--surface-2);border-radius:12px;padding:10px 14px;text-align:left;overflow-x:auto;max-width:100%}

/* Penales */
.pen{position:relative;height:150px;border-radius:18px;overflow:hidden;border:var(--bw) solid var(--K);background:linear-gradient(180deg,#8FD3F7 0 38%,#3FA34D 38% 100%)}
.pen .goal{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:230px;height:84px}
.pen .keeper{position:absolute;left:50%;top:40px;width:54px;margin-left:-27px;transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.pen .ball{position:absolute;left:50%;top:112px;width:30px;margin-left:-15px;transition:transform .55s cubic-bezier(.2,.8,.3,1)}
.pen.go-l .ball{transform:translate(-78px,-82px) scale(.62)}
.pen.go-r .ball{transform:translate(78px,-82px) scale(.62)}
.pen.dive-l .keeper{transform:translateX(-70px) rotate(-60deg)}
.pen.dive-r .keeper{transform:translateX(70px) rotate(60deg)}
.pen.saved-l .ball{transform:translate(-50px,-60px) scale(.7)}
.pen.saved-r .ball{transform:translate(50px,-60px) scale(.7)}
.pen .score{position:absolute;right:8px;bottom:6px;display:flex;gap:4px}
.pen .score i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid var(--K)}
.pen .score i.gol{background:#fff} .pen .score i.no{background:var(--r)}
.pen .label{position:absolute;left:10px;bottom:6px;font-family:var(--cartoon);color:#fff;-webkit-text-stroke:2px var(--K);paint-order:stroke fill;font-size:1.3em;animation:pop .4s both .45s}

/* Secciones */
.flag-ar{height:120px;border-radius:var(--rad);overflow:hidden;border:var(--bw) solid var(--K);box-shadow:var(--pop);background:linear-gradient(180deg,#74ACDF 0 33.33%,#FFFFFF 33.33% 66.66%,#74ACDF 66.66% 100%);position:relative}
.flag-ar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(-100%);animation:shine 4s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.pitch{height:130px;border-radius:var(--rad);overflow:hidden;border:var(--bw) solid var(--K);box-shadow:var(--pop);background:repeating-linear-gradient(90deg,#3FA34D 0 34px,#37944A 34px 68px);position:relative}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:3px solid rgba(255,255,255,.75);border-radius:50%}
.pitch::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid rgba(255,255,255,.75)}
.pitch .rolling{position:absolute;top:44px;left:-50px;width:44px;animation:roll 5s linear infinite;z-index:1}
@keyframes roll{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(480px) rotate(720deg)}}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink);cursor:pointer;padding:14px}
.cat h2{font-size:1.1em}
.cat p{font-size:.82em;color:var(--muted)}
.cat .state{font-size:.78em;font-weight:800;color:var(--c2,var(--muted))}

/* Grupos */
.group-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;color:var(--ink);width:100%;cursor:pointer}
.avatars{display:flex}
.avatars span{margin-left:-12px;display:block}
.avatars span:first-child{margin-left:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:.72em;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--c-soft,var(--surface-2));color:var(--c,var(--muted))}
.code{font-family:var(--cartoon);letter-spacing:.12em;font-size:1.4em;color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;border:2px solid var(--K)}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--y);color:var(--K)}
.rank{display:flex;flex-direction:column}
.rank-row{display:grid;grid-template-columns:30px auto 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.rank-row:last-child{border-bottom:0}
.rank-row.me{background:var(--y-soft);border-radius:12px}
.pos{font-family:var(--cartoon);text-align:center;font-size:1.15em;color:var(--muted)}
.pos.p1{color:var(--gold2);-webkit-text-stroke:1.5px var(--K);paint-order:stroke fill}
.pos.p2{color:#A9B2C8;-webkit-text-stroke:1.5px var(--K);paint-order:stroke fill}
.pos.p3{color:#D58A4E;-webkit-text-stroke:1.5px var(--K);paint-order:stroke fill}
.rname{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpts{font-weight:800;font-variant-numeric:tabular-nums}
.trophy-row{display:flex;align-items:center;gap:10px;background:var(--y-soft);border-radius:16px;padding:10px 12px;font-weight:700;border:2px solid var(--K)}
.opt-chips{display:flex;flex-wrap:wrap;gap:8px}
.opt-chips label{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer}
.opt-chips input{accent-color:var(--b)}
.opt-chips label:has(input:checked){border-color:var(--K);background:var(--y)}

/* Ruleta */
.wheel-wrap{position:relative;width:min(88vw,330px);aspect-ratio:1/1;margin:8px auto 0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.wheel-wrap:active{cursor:grabbing}
.wheel{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.12,.75,.15,1);filter:drop-shadow(0 6px 0 var(--K))}
.wheel-pin{position:absolute;left:50%;top:-14px;width:46px;margin-left:-23px;z-index:2;filter:drop-shadow(0 3px 0 var(--K))}
.wheel-hub{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:#fff;border:var(--bw) solid var(--K);display:grid;place-items:center;z-index:2}
.wheel-wrap.spinning .wheel-pin{animation:tick .12s linear infinite}
@keyframes tick{50%{transform:rotate(-12deg)}}
.prize{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.prize .big{font-family:var(--cartoon);font-size:2em;color:var(--y);-webkit-text-stroke:3px var(--K);paint-order:stroke fill;text-shadow:0 3px 0 var(--K);animation:pop .5s cubic-bezier(.2,.9,.3,1.6) both}

/* Tito: animaciones */
.anim-idle{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%;display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-2deg)}75%{transform:translateY(-4px) rotate(2deg)}}
.anim-happy{animation:hop .55s ease-out 2;transform-origin:50% 100%;display:inline-block}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-6deg)}70%{transform:translateY(-6px) rotate(4deg)}}
.anim-dizzy{animation:wob .45s ease-in-out 3;transform-origin:50% 100%;display:inline-block}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) translateX(-3px)}75%{transform:rotate(10deg) translateX(3px)}}
.anim-nervous{animation:shiver .14s linear infinite;display:inline-block}
@keyframes shiver{0%,100%{transform:translateX(0)}50%{transform:translateX(1.6px)}}
.anim-enter{animation:enter .7s cubic-bezier(.2,.9,.3,1.5) both;display:inline-block;transform-origin:50% 100%}
@keyframes enter{0%{transform:translateY(40px) scale(.4);opacity:0}70%{transform:translateY(-8px) scale(1.05);opacity:1}100%{transform:none}}
.blink{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.flt{animation:flt 2.4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-5px)}}

/* Habitación y tienda */
.room{position:relative;border-radius:var(--rad);overflow:hidden;border:var(--bw) solid var(--K);box-shadow:var(--pop);height:300px}
.room .wall{position:absolute;left:0;right:0;top:0;height:72%}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:28%;border-top:var(--bw) solid var(--K)}
.room .r-frame{position:absolute;top:16px;left:16px;width:78px}
.room .r-furni{position:absolute;left:8px;bottom:22%;width:120px}
.room .r-deco{position:absolute;right:12px;bottom:18%;width:64px}
.room .r-tito{position:absolute;left:50%;bottom:9%;transform:translateX(-50%)}
.room .r-bubble{position:absolute;right:12px;top:28px;max-width:56%;font-size:.8em}
.room .r-tags{position:absolute;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:.85em}
.meter .bar{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;border:2px solid var(--K)}
.meter .bar span{display:block;height:100%}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);border-radius:16px;padding:8px 4px;background:var(--surface);color:var(--ink);font-weight:800;font-size:.76em;text-align:center;transition:transform .12s}
.item:active{transform:scale(.95)}
.item.on{border-color:var(--g);background:var(--g-soft)}
.item.try{border-color:var(--K);box-shadow:0 3px 0 var(--K);background:var(--y-soft)}
.item .thumb{height:70px;display:grid;place-items:center}
.rar{font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:999px;color:#fff;background:var(--rc)}
.rar.p{color:#3A2600}
.price-l{font-weight:800;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.price-l.no{color:var(--muted)}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-tabs button{border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.cat-tabs button[aria-pressed="true"]{background:var(--b);color:#fff;border-color:var(--K)}
.buybar{display:flex;align-items:center;gap:12px}

/* Ajustes */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:1.8em;font-variant-numeric:tabular-nums;line-height:1.1}
.dist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dist-row{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.dist-bar{background:var(--absent);color:#fff;border-radius:6px;padding:2px 8px;text-align:right;min-width:28px;font-size:.85em;display:inline-block}
.dist-bar.hi{background:var(--g)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.switch{position:relative;width:54px;height:32px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--line);border:2px solid var(--K)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--K);transition:transform .15s}
.switch input:checked + span{background:var(--g)}
.switch input:checked + span::after{transform:translateX(22px)}
.switch input:focus-visible + span{outline:3px solid var(--b);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.78em;font-weight:800;color:var(--muted)}
.field input,.field select{width:100%;border:2px solid var(--K);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink)}
.owner-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.owner-grid .field input{padding:7px 9px}
.money{margin-top:12px;padding:12px;border-radius:12px;background:var(--g-soft)}
.money b{font-family:var(--display);font-size:1.6em;color:var(--g);font-variant-numeric:tabular-nums}
.arch-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.arch-marks{display:flex;gap:6px;margin-top:4px}
.arch-marks span{font-size:.74em;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.arch-marks span.done{background:var(--g-soft);color:var(--g)}
.time-input{border:2px solid var(--K);background:var(--surface-2);border-radius:10px;padding:7px 9px;color:var(--ink)}

/* Premium */
.prem-head{margin:-14px -16px 14px;padding:22px 16px 18px;background:linear-gradient(165deg,var(--bg1),var(--bg2) 60%,var(--bg3));border-radius:20px 20px 0 0;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;border-bottom:var(--bw) solid var(--K)}
.prem-head .stripe4{position:absolute;left:0;right:0;bottom:0;border-radius:0;height:5px}
.premium-word{font-family:var(--cartoon);font-size:2.3em;line-height:1;letter-spacing:.06em;background:linear-gradient(180deg,#FFF6C8 0%,#FFD34D 45%,#E2A100 70%,#FFE58A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #5A3B00;filter:drop-shadow(0 3px 0 #2A1A00)}
.benefits{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.benefits li{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;background:var(--c-soft);border-radius:16px;padding:8px 10px;font-weight:800;border:2px solid var(--K)}
.benefits li span.bi{width:46px;height:46px;border-radius:13px;background:var(--c);display:grid;place-items:center;color:#fff;border:2px solid var(--K)}
.benefits li span.bi.y{color:var(--K)}
.benefits li small{display:block;font-weight:600;color:var(--muted)}
.benefits svg{width:26px;height:26px}
.price{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.price div{border:2px solid var(--K);border-radius:16px;padding:10px;background:var(--surface);position:relative}
.price div.best{background:var(--y-soft)}
.price .save{position:absolute;top:-11px;right:8px;background:var(--r);color:#fff;font-size:.7em;font-weight:800;border-radius:999px;padding:1px 8px;border:2px solid var(--K)}
.price b{display:block;font-family:var(--display);font-size:1.25em;font-variant-numeric:tabular-nums}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:60;background:#0A0D1F;color:#EEF1FA;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.ov-top{display:flex;justify-content:space-between;align-items:center}
.ov-top .ad-tag{color:#E9D98F}
.ov-close{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-variant-numeric:tabular-nums}
.ov-close:disabled{opacity:.6;cursor:default}
.ov-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;max-width:420px;margin:0 auto;width:100%}
.ov-creative{width:100%;aspect-ratio:4/5;max-height:50vh;border-radius:20px;border:1px dashed rgba(233,217,143,.5);background:repeating-linear-gradient(135deg,#131733 0 14px,#181D3D 14px 28px);display:grid;place-items:center;padding:20px}
.ov-creative h3{font-size:1.4em;color:#fff}
.ov-creative p{color:#B5BCD6;margin-top:6px;font-size:.9em}
.ov-progress{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.ov-progress span{display:block;height:100%;width:0;background:var(--y)}
.reward-chip{background:var(--y);color:var(--K);font-weight:800;border-radius:999px;padding:6px 14px;font-size:.9em}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s, transform .45s}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .brand .tito span, #splash .brand .unra{animation:drop .6s cubic-bezier(.2,.9,.3,1.5) both}
#splash .brand .unra{animation-delay:.05s}
#splash .brand .tito span:nth-child(1){animation-delay:.25s} #splash .brand .tito span:nth-child(2){animation-delay:.38s}
#splash .brand .tito span:nth-child(3){animation-delay:.51s} #splash .brand .tito span:nth-child(4){animation-delay:.64s}
@keyframes drop{0%{opacity:0;translate:0 -60px}70%{opacity:1;translate:0 6px}100%{translate:0 0}}
#splash .egg{animation:enter .8s cubic-bezier(.2,.9,.3,1.5) both .8s}
#sheetRoot{position:fixed;inset:0;z-index:40;display:none}
#sheetRoot.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(6,8,24,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;border:var(--bw) solid var(--K);border-bottom:0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet.center{top:50%;bottom:auto;left:16px;right:16px;border-radius:24px;border-bottom:var(--bw) solid var(--K);transform:translateY(-50%);animation:popc .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes popc{from{transform:translateY(-50%) scale(.7);opacity:0}to{transform:translateY(-50%) scale(1);opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.sheet form{display:flex;flex-direction:column;gap:14px}
.sheet .close-float{position:absolute;top:12px;right:12px;z-index:2;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff}
#liveNotif{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;max-width:500px;margin:0 auto;z-index:80;display:none;gap:10px;background:var(--surface);color:var(--ink);border:var(--bw) solid var(--K);border-radius:18px;padding:12px;text-align:left;box-shadow:var(--pop)}
#liveNotif.show{display:flex;animation:up .3s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border:1.5px solid var(--K);border-radius:3px;animation:fall var(--d) cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--rot))}}
nav.tabs button:not([aria-current]) .ti svg{filter:grayscale(.8);opacity:.6}
.flame svg,.pen .ball svg,.rolling svg,.r-frame svg,.r-furni svg,.r-deco svg,.thumb span svg{width:100%;height:auto;display:block}
/* Tito: bailes (cadera = cuerpo abajo, hombros = inclinación arriba), saltos, indiferente y llanto */
.tito .t-body{transform-box:view-box;transform-origin:60px 130px}
.tito .t-feet,.tito .t-foot{transform-box:view-box}
.tito .t-feet{transform-origin:60px 131px} .tito .t-foot-l{transform-origin:46px 131px} .tito .t-foot-r{transform-origin:74px 131px}
.dance-funk .t-body{animation:funk .46s ease-in-out infinite}
@keyframes funk{0%,100%{transform:translateX(-6px) skewX(11deg) rotate(-2deg)}25%{transform:translateY(-6px) skewX(0) scaleY(1.03)}50%{transform:translateX(6px) skewX(-11deg) rotate(2deg)}75%{transform:translateY(-6px) skewX(0) scaleY(1.03)}}
.dance-funk .t-foot-l,.dance-cumbia .t-foot-l,.dance-robot .t-foot-l{animation:step .46s ease-in-out infinite}
.dance-funk .t-foot-r,.dance-cumbia .t-foot-r,.dance-robot .t-foot-r{animation:step .46s ease-in-out infinite;animation-delay:-.23s}
@keyframes step{0%,100%{transform:none}50%{transform:translateY(-6px) rotate(-12deg)}}

/* ---- Toasts: tarjeta centrada arriba ---- */
#toast{position:fixed;left:0;right:0;margin:0 auto;top:calc(env(safe-area-inset-top) + 70px);width:max-content;max-width:min(92vw,420px);z-index:95;display:none;align-items:center;gap:10px;background:#fff;color:var(--K);border:3px solid var(--K);border-radius:18px;padding:9px 16px 9px 9px;box-shadow:0 5px 0 var(--K);font-weight:800;text-align:left;animation:tdrop .45s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
@keyframes tdrop{from{transform:translateY(-30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
#toast .ti{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--K);display:grid;place-items:center;flex:none;background:var(--tc,#6C4CE0);color:#fff;font-family:var(--cartoon);font-size:1.15em}

@keyframes tspin{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}
#toast .tm{display:flex;flex-direction:column;gap:4px;min-width:0}
#toast.t-pts{--tc:var(--y);background:#FFF6CF}
#toast.t-pts .tm>span:first-child{font-family:var(--cartoon);font-weight:400;font-size:1.25em;letter-spacing:.02em}
#toast.t-money{--tc:var(--r);background:#FFE4E0}
#toast.t-ok{--tc:var(--g);background:#E3F8E8}
#toast.t-info{--tc:#6C4CE0;background:#EFE9FF}
.t-bar{display:block;height:9px;width:190px;max-width:60vw;border-radius:9px;background:#fff;border:2px solid var(--K);overflow:hidden}
.t-bar span{display:block;height:100%;background:var(--y);border-right:2px solid var(--K)}
.t-sub{font-size:.75em;font-weight:700;opacity:.75}
/* ---- Monedas que vuelan al monedero ---- */
.fly-coin{position:fixed;z-index:96;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3B0,#F2B705 60%,#B37A00);border:2px solid var(--K);pointer-events:none;animation:flyc .8s cubic-bezier(.5,-0.4,.7,1) both}

.arc-live{position:absolute;top:8px;left:0;right:0;margin:0 auto;width:max-content;z-index:1;pointer-events:none;font-family:var(--cartoon);font-size:2.5em;line-height:1;color:#fff;-webkit-text-stroke:4px var(--K);paint-order:stroke fill;text-shadow:0 4px 0 var(--K);letter-spacing:.03em;transition:opacity .2s}
.arc-live.bump{animation:sbump .3s ease}
.arc-live.hide{opacity:0}
@keyframes sbump{0%{transform:scale(1)}40%{transform:scale(1.28);color:var(--y)}100%{transform:scale(1)}}
.arc-cele{position:absolute;left:0;right:0;bottom:12%;margin:0 auto;width:max-content;z-index:1;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:2px}
.arc-cele.on{display:flex;animation:celein 2.4s ease both}
.arc-cele b{font-family:var(--cartoon);font-weight:400;font-size:1.5em;color:var(--y);-webkit-text-stroke:3px var(--K);paint-order:stroke fill;text-shadow:0 3px 0 var(--K);white-space:nowrap}

.cele-dance{display:inline-block}
.arc-box .cele-dance.in-box{display:block;margin:-4px auto 0;line-height:0}

.pts-pop{display:inline-block;font-family:var(--cartoon);font-weight:400;font-size:1.7em;color:var(--y);-webkit-text-stroke:3px var(--K);paint-order:stroke fill;text-shadow:0 3px 0 var(--K);vertical-align:-.12em;margin-left:4px;animation:ppop .6s cubic-bezier(.3,1.8,.5,1) both}

const pad = n => String(n).padStart(2,"0");

const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayIndex = s => Math.round((parse(s) - new Date(2026,0,1)) / 864e5);
const daysBetween = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const mod = (a,n) => ((a % n) + n) % n;
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DOW = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fmtDay = s => { const d = parse(s); return DOW[d.getDay()]+" "+d.getDate()+" de "+MONTHS[d.getMonth()]; };
const fmtShort = s => { const d = parse(s); return d.getDate()+"/"+(d.getMonth()+1); };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* Azar de verdad para las partidas individuales (no se repite entre días ni entre partidas) */
function rnd(){ try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; } catch(e){ return Math.random(); } }
function shuffle(arr, r){ r = r || rnd; const a = arr.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

   Cada partida mezcla dificultades (fácil → difícil), no repite tema ni respuesta, y evita respuestas que salieron hace poco. */
const normA = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

const dMatch = (d, x) => !d || (d === 12 ? x.d <= 2 : x.d === d);
function markSeen(ids){ const set = new Set(ids); S.seen = S.seen.filter(id => !set.has(id)).concat(ids); if (S.seen.length > 6000) S.seen = S.seen.slice(-6000); }
function freshPool(bank, n){
  const pos = new Map(); S.seen.forEach((id,i) => pos.set(id, i));
  let pool = bank.filter(q => !pos.has(q.id));
  if (pool.length < n * 3) { const old = bank.filter(q => pos.has(q.id)).sort((a,b) => pos.get(a.id) - pos.get(b.id)); pool = pool.concat(old.slice(0, Math.max(n * 4, Math.floor(old.length / 3)))); }
  return shuffle(pool);
}
function pickFresh(bank, n){
  const pool = freshPool(bank, n), recent = new Set(S.recentAns || []), plan = PLAN[n] || Array(n).fill(0);
  const out = [], cats = new Set(), ans = new Set();
  const free = (q, lvl) => !out.includes(q) && !ans.has(normA(q.right)) && (lvl > 1 || !recent.has(normA(q.right))) && (lvl > 0 || !cats.has(q.cat));
  plan.forEach(d => {
    let q = null;
    for (let lvl = 0; lvl < 3 && !q; lvl++) q = pool.find(x => dMatch(d, x) && free(x, lvl));
    for (let lvl = 0; lvl < 3 && !q; lvl++) q = pool.find(x => free(x, lvl));
    if (q) { out.push(q); cats.add(q.cat); ans.add(normA(q.right)); }
  });
  for (const q of pool) { if (out.length >= n) break; if (!out.includes(q)) out.push(q); }

const ANS_ORDER = shuffle(ANSWERS, rng(20260101));
const soupCache = {};
function soupFor(key, seed, themeIdx){
  if (soupCache[key]) return soupCache[key];
  const theme = THEMES[themeIdx], N = 11, D = { H:[0,1], V:[1,0], D:[1,1], U:[-1,1] };
  const ALL = [[0,1],[1,0],[1,1],[-1,1],[0,-1]], GEN_L = "AAAAEEEEEOOOOIIISSSRRRNNNLLLDDCCTTUUMMPPBGVYHFJZÑQ";
  for (let attempt = 0; attempt < 120; attempt++) {
    const r = rng(seed*13 + attempt*7919), g = Array.from({length:N}, () => Array(N).fill(""));
    const chosen = theme.w.length > 8 ? shuffle(theme.w, rng(seed*31 + 7)).slice(0, 8) : theme.w;
    const plan = shuffle(["H","H","V","V","D","D","U","X"], r), words = chosen.slice().sort((a,b) => b.length - a.length), place = []; let ok = true;
    const tryPlace = (w, dr, dc, tries) => {
      for (let t = 0; t < tries; t++) {
        const r0 = Math.floor(r()*N), c0 = Math.floor(r()*N), r1 = r0 + dr*(w.length-1), c1 = c0 + dc*(w.length-1);
        if (r1 < 0 || r1 >= N || c1 < 0 || c1 >= N) continue;
        let fits = true; for (let k = 0; k < w.length; k++) { const ch = g[r0+dr*k][c0+dc*k]; if (ch && ch !== w[k]) { fits = false; break; } }
        if (!fits) continue;
        const cells = []; for (let k = 0; k < w.length; k++) { g[r0+dr*k][c0+dc*k] = w[k]; cells.push([r0+dr*k, c0+dc*k]); }
        place.push({ w, cells }); return true;
      }
      return false;
    };
    for (let k = 0; k < words.length && ok; k++) {
      let d; if (plan[k] === "X") d = [0, -1]; else d = D[plan[k]];
      if (!tryPlace(words[k], d[0], d[1], 400)) { const alt = ALL[Math.floor(r()*ALL.length)]; if (!tryPlace(words[k], alt[0], alt[1], 400)) ok = false; }
    }
    if (!ok) continue;
    const pool = chosen.join("");
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!g[y][x]) g[y][x] = r() < 0.5 ? pool[Math.floor(r()*pool.length)] : GEN_L[Math.floor(r()*GEN_L.length)];
    return soupCache[key] = { theme:theme.t, grid:g, place:chosen.map(w => place.find(p => p.w === w)), N };
  }
  return null;
}

    if (!w.ref || !w.pending) return; if (w.busy) { clearTimeout(w.t); w.t = setTimeout(w.flush, 600); return; }
    const fn = w.pending; w.pending = null; w.busy = true;

      if (e && ["invalid_argument","revoked","not_granted","capability_disabled","capability_removed"].includes(e.code)) w.ref = null;
    }
    w.busy = false; if (w.pending) w.flush();
  };
  return w;
}

function spin(dir, power){

  if (spinning) return; const w = dayCounter("wheel"); if (w.n >= LIMITS.spins) return;
  const go = () => {
    const total = WHEEL.reduce((s,x) => s + x.w, 0); let r = rnd()*total, idx = 0; for (; idx < WHEEL.length; idx++) { r -= WHEEL[idx].w; if (r < 0) break; } idx = Math.min(idx, WHEEL.length-1);

function basePoints(kind, p){

  if (kind === "w") return p.w.won ? 12 + ((p.w.extra ? 7 : 6) - p.w.g.length) * 2 + Math.floor((p.w.left||0) / 15) : 2;

  if (ctx.kind === "m") return p.t.ans.filter(a => a && a.ok).length * 3;

}

/* Cuentas rápidas: se generan al azar, nunca se repiten. Hasta las fáciles llevan números de dos cifras. */
function mathQs(n){
  const R = (a, b) => a + Math.floor(rnd() * (b - a + 1)), pick = L => L[Math.floor(rnd() * L.length)];
  const mk = (d) => {
    let q, r, trap = [];
    if (d === 1) { const t = R(0, 2);
      if (t === 0) { const x = R(14, 68), y = R(17, 49); q = `${x} + ${y}`; r = x + y; trap = [r + 10, r - 10]; }
      else if (t === 1) { const x = R(42, 98), y = R(13, x - 12); q = `${x} − ${y}`; r = x - y; trap = [r + 10, r - 10]; }
      else { const x = R(12, 19), y = R(3, 6); q = `${x} × ${y}`; r = x * y; trap = [r + y, r - x]; } }
    else if (d === 2) { const t = R(0, 4);
      if (t === 0) { const x = R(23, 49), y = R(4, 9); q = `${x} × ${y}`; r = x * y; trap = [r + 10, r - y]; }
      else if (t === 1) { const y = R(6, 13), z = R(7, 16); q = `${y * z} ÷ ${y}`; r = z; trap = [z + 1, z - 1]; }
      else if (t === 2) { const p = pick([10, 20, 25, 50]), base = { 10:10, 20:5, 25:4, 50:2 }[p], v = base * R(6, 40); q = `${p}% de ${v}`; r = v * p / 100; trap = [r * 2, Math.round(r / 2)]; }
      else if (t === 3) { const x = R(11, 16); q = `${x}²`; r = x * x; trap = [x * 2, r + x]; }
      else { const x = R(15, 48), y = R(21, 57), z = R(12, 39); q = `${x} + ${y} + ${z}`; r = x + y + z; trap = [r + 10, r - 1]; } }
    else { const t = R(0, 4);
      if (t === 0) { const x = R(6, 30), y = R(3, 9), z = R(4, 12), w = R(2, 20); q = `${x} + ${y} × ${z} − ${w}`; r = x + y * z - w; trap = [(x + y) * z - w, x + y * (z - w)]; }
      else if (t === 1) { const x = R(13, 29), y = R(12, 19); q = `${x} × ${y}`; r = x * y; trap = [r + 10, r - x]; }
      else if (t === 2) { const den = pick([3, 4, 5, 8]), num = R(1, den - 1), v = den * R(8, 40); q = `${num}/${den} de ${v}`; r = v * num / den; trap = [v / den, r + v / den]; }
      else if (t === 3) { const p = pick([15, 35, 45, 12, 75]), unit = p === 12 ? 25 : 20, v = unit * R(3, 20); q = `${p}% de ${v}`; r = v * p / 100; trap = [r + 5, Math.round(r * 1.5)]; }
      else { const x = R(13, 25); q = `√${x * x}`; r = x; trap = [x + 1, x * 2]; } }
    const wrong = []; [...trap, r + 1, r - 1, r + 2, r - 2, r + 10, r - 10, r + 5].forEach(v => { if (v !== r && v >= 0 && Number.isInteger(v) && !wrong.includes(v) && wrong.length < 3) wrong.push(v); });
    const fmt = v => NUM.format(v);
    return { id:"m"+Math.floor(rnd() * 1e9).toString(36), cat:"mat", d, q:`¿Cuánto es ${q}?`, right:fmt(r), opts:shuffle([fmt(r)].concat(wrong.map(fmt))), time:[15, 18, 22][d - 1] };
  };
  return shuffle(PLAN[7].slice(0, n).map(mk));
}

function meMember(){ return { id:remote.uid || "me", me:true, name:S.profile.name || "Tú", country:S.profile.country, tito:S.tito, earned:S.earned, scores:S.gscore }; }
function botMember(b, code){
  const scores = { [code]:{ total:0, days:{} } }, T = today();
  for (let k = 0; k < 14; k++) { const d = addDays(T, -k), r = rng(hashStr(b.n + code + d)); if (k > 0 ? r() < 0.85 : r() < 0.6) { scores[code].days[d] = 20 * (1 + Math.floor(r()*5)); scores[code].total += scores[code].days[d]; } }
  return { id:"bot-"+b.n, bot:true, name:b.n, country:b.c, tito:b.t, earned:b.lv*10, scores };
}
async function loadMembers(code){
  const g = S.groupMeta[code] || {};
  if (g.demo) return BOTS.map(b => botMember(b, code)).concat([meMember()]);
  if (!remote.db || g.local) return [meMember()];
  try {
    const qs = await remote.db.collection("members").where("groups","array-contains",code).limit(60).get();
    const list = qs.docs.map(d => Object.assign({ id:d.id }, d.data()));
    const mine = list.findIndex(m => m.id === remote.uid);
    if (mine >= 0) list[mine] = Object.assign(list[mine], meMember()); else list.push(meMember());
    return list;
  } catch(e){ return [meMember()]; }
}
function membersFor(code){
  const c = groupCache[code];
  if ((!c || Date.now() - c.t > 30000) && !(c && c.loading)) {
    groupCache[code] = Object.assign(c || { list:null }, { loading:true, t:Date.now() });
    loadMembers(code).then(list => { groupCache[code] = { list, t:Date.now(), loading:false }; if ((view === "group" && curGroup === code) || view === "groups") render(false); });
  }
  return (groupCache[code] && groupCache[code].list) || (S.groupMeta[code] && S.groupMeta[code].demo ? BOTS.map(b => botMember(b, code)).concat([meMember()]) : [meMember()]);
}

  else if (k === "s-hint") sHint();
  else if (k === "t-pick") {
    const d = play(ctx).t, q = qsOf(ctx)[tQ], tl = q.time || TIME.q, left = Math.max(0, Math.ceil(tl - (Date.now() - d.qt0)/1000)); tPicked = el.dataset.v;
    if (tPicked === q.right) { SND.ok(); d.ans[tQ] = { ok:true, left, clues:d.clues[tQ] || 1 }; tResolved = true; feed(ctx.kind === "m" ? 12 : 4); setReact(left >= tl*.7 ? "star" : "happy", 1500); if (ctx.style === "pen") setTimeout(() => confetti(24), 450); }
    else { SND.bad(); if (d.second || isGroup() || ctx.kind === "m" || ctx.kind === "f" || q.clues) { d.ans[tQ] = { ok:false, left:0 }; tResolved = true; } setReact("dizzy", 1500); }
    save(); render();
  }
  else if (k === "t-clue") { const d = play(ctx).t; d.clues[tQ] = Math.min(3, (d.clues[tQ] || 1) + 1); save(); render(); }
  else if (k === "t-second") showRewarded("otra oportunidad", () => { const d = play(ctx).t; d.second = true; d.removed[tQ] = (d.removed[tQ]||[]).concat([tPicked]); d.qi = -1; tPicked = null; tResolved = false; save(); render(); });
  else if (k === "t-reveal") { play(ctx).t.ans[tQ] = { ok:false, left:0 }; tResolved = true; save(); render(); }
  else if (k === "t-next") { autoNx = null; const d = play(ctx).t, n = qsOf(ctx).length; tPicked = null; tResolved = false; tQ++; if (d.ans.length >= n && d.ans.every(Boolean)) { d.done = true; finishGame("t"); if (wonGame("t")) setTimeout(() => confetti(), 300); } save(); render(); }
  else if (k === "t-hint") { const d = play(ctx).t, i = tQ, q = qsOf(ctx)[i]; useHint("una pista 50:50", () => { d.removed[i] = shuffle(q.opts.filter(o => o !== q.right)).slice(0,2); save(); render(); }); }
  else if (k === "share-day") copy(shareText(makeCtx("d", null, curDay || today())));
  else if (k === "share-ctx") copy(shareText(ctx));
  else if (k === "open-day") setView("games", { day:v });
  else if (k === "unlock") showRewarded("el día "+fmtShort(v), () => { S.unlocked.push(v); save(); setView("games", { day:v }); }, () => toast("Saliste antes de terminar el video."));
  else if (k === "more") { moreTab = v; setView("more"); }
  else if (k === "open-group") setView("group", { group:v });
  else if (k === "rank") { rankMode = v; render(false); }
  else if (k === "new-group") openNewGroup();
  else if (k === "join-group") openJoinGroup();
  else if (k === "invite") { const g = S.groupMeta[v]; copy("¡Únete a mi grupo «"+g.name+"» en unraTITO! Todos los días jugamos contra reloj y competimos. Código: "+v, "Invitación copiada. Mándala por WhatsApp."); }
  else if (k === "leave") { if (el.dataset.confirm) { S.groups = S.groups.filter(c => c !== v); save(); pushMember(); setView("groups"); toast("Saliste del grupo"); } else { el.dataset.confirm = "1"; el.textContent = "Toca de nuevo para salir"; } }
  else if (k === "shopgroup") { shopGroup = v; shopCat = shopCatsOf(v)[0]; tryOn = null; render(false); }
  else if (k === "shopcat") { shopCat = v; render(false); }
  else if (k === "pick") { const [cat, key] = v.split(":"); if (cat === "dance" && owns(cat, key)) { wear(cat, key); tryOn = { cat, key }; save(); render(false); setTimeout(() => { if (tryOn && tryOn.key === key && owns(cat, key)) { tryOn = null; if (view === "tito") render(false); } }, 3000); return; } if (owns(cat, key)) { wear(cat, key); tryOn = null; save(); pushMember(); render(false); } else { tryOn = { cat, key }; render(false); $("#main").scrollTo({ top:0, behavior:"smooth" }); } }
  else if (k === "untry") { tryOn = null; render(false); }
  else if (k === "buy") {
    if (!tryOn) return; const it = itemOf(tryOn.cat, tryOn.key), price = priceOf(tryOn.cat, tryOn.key); if (typeof price !== "number" || S.coins < price) return;
    SND.buy(); S.coins -= price;
    const give = (c, k) => { const o = S.owned[c] = S.owned[c] || []; if (!o.includes(k)) o.push(k); };
    if (tryOn.cat === "kit") kitParts(tryOn.key).forEach(([c, k]) => { if (!owns(c, k)) give(c, k); }); else give(tryOn.cat, tryOn.key);
    wear(tryOn.cat, tryOn.key); cheer(15);
    const name = it[1]; tryOn = null; save(); pushMember(); render(false); toast("¡Compraste "+name+"!"); confetti(30);
  }
  else if (k === "snack") { const sn = dayCounter("snacks"), go = () => startGame(makeCtx("m", dayCounter("snacks").n, today()), "t"); if (sn.n >= LIMITS.freeSnacks) showRewarded("una merienda más", go, () => toast("Saliste antes de terminar el video.")); else go(); }
  else if (k === "bonus") { const b = dayCounter("bonus"); if (b.n >= LIMITS.bonus) return; showRewarded("30 puntos", () => { dayCounter("bonus").n++; addCoins(30); save(); pushMember(); render(false); toast("+30 puntos"); }, () => toast("Saliste antes de terminar el video.")); }
  else if (k === "profile") openProfile(false);
  else if (k === "report") { const q = qsOf(ctx)[tQ]; (S.reports = S.reports || []).push({ id:v, q:q ? q.q : "", right:q ? q.right : "", day:today() }); save(); SND.pop(); toast("¡Gracias! La vamos a revisar."); render(); }
  else if (k === "streak-toggle") { streakOpen = !streakOpen; render(false); }
  else if (k === "level") { closeSheet(); openLevel(); }
  else if (k === "lvwear") { const [cat, key] = v.split(":"); S.tito[cat] = key === "off" ? DEF[cat] : key; save();
    const ls = $("#sheetRoot .lvl-sheet"), lu = $("#sheetRoot .lvlup-list"); if (ls) ls.outerHTML = levelHTML(); else if (lu) lu.innerHTML = lvUpNews.map(g => lvGiftRow(g, level())).join("");
    render(false); toast(key === "off" ? "Listo, te lo sacaste" : "¡Te queda genial!", key === "off" ? "info" : "ok"); }
  else if (k === "premium") openPremium();
  else if (k === "premium-from-ad") { showInterstitial.cancel && showInterstitial.cancel(); openPremium(); }
  else if (k === "go-premium") { S.settings.premium = true; save(); closeSheet(); render(false); toast("¡PREMIUM activado!"); confetti(); }
  else if (k === "close-sheet") { closeSheet(); if (!S.profile.done) { S.profile.done = true; save(); afterOnboarding(); } }
  else if (k === "test-notif") { const ns = notifMsgs(); liveNotify(ns[new Date().getHours() < 15 ? 0 : 1]); }
  else if (k === "open-notif") { $("#liveNotif").classList.remove("show"); showInterstitial("Anuncio al abrir la app desde un aviso", () => setView("home", { day:today() })); }
  else if (k === "reset") { if (el.dataset.confirm) { const keep = S.settings, seen = S.seen, ra = S.recentAns; S = blank(); S.settings = keep; S.seen = seen || []; S.recentAns = ra || []; save(); setView("home", { day:today() }); openProfile(true); } else { el.dataset.confirm = "1"; el.textContent = "Toca de nuevo para borrar"; } }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "groupForm") { const name = f.querySelector("#gName").value.trim(); if (!name) return; createGroup(name, f.querySelector('input[name="gTheme"]:checked').value, f.querySelector('input[name="gGame"]:checked').value); }
  if (f.id === "joinForm") joinGroup(f.querySelector("#jCode").value);
  if (f.id === "redeemForm") redeemCode(f.querySelector("#rCode").value);
  if (f.id === "profileForm") {
    const name = f.querySelector("#pfName").value.trim(); if (!name) { toast("Pon un nombre o apodo"); return; }
    S.profile.name = name; S.profile.country = f.querySelector("#pfCountry").value;
    const first = !S.profile.done; S.profile.done = true; save(); pushMember(); closeSheet(); render(false); if (first) { toast("¡Hola, "+name+"!"); afterOnboarding(); }
  }
});
document.addEventListener("change", e => {
  const t = e.target; if (t.type === "checkbox" && t.id !== "soundOn") SND.toggle(t.checked);
  if (t.id === "bigOn") { S.settings.big = t.checked; applySettings(); save(); }
  else if (t.id === "soundOn") { S.settings.sound = t.checked; save(); if (t.checked) SND.ok(); }
  else if (t.id === "musicOn") { S.settings.music = t.checked; save(); if (t.checked) SND.groove(); else SND.stop(); }
  else if (t.id === "notifOn") { S.settings.notif = t.checked; save(); }
  else if (t.id === "premiumOn") { S.settings.premium = t.checked; save(); render(false); toast(t.checked ? "PREMIUM activado" : "Volviste al plan gratis"); }
  else if (t.classList.contains("time-input") && t.value) { S.settings.times[Number(t.dataset.slot)] = t.value; save(); render(false); }
});
document.addEventListener("input", e => {
  const t = e.target; if (!t.classList.contains("owner-in")) return;
  const map = { o_dau:"dau", o_prem:"prem", o_bpu:"bpu", o_eb:"eb", o_ipu:"ipu", o_ei:"ei", o_rpu:"rpu", o_er:"er", o_price:"price" };
  const o = S.settings.owner; o[map[t.id]] = Math.max(0, Number(t.value) || 0);
  const ads = o.dau*30*(1-o.prem/100)*(o.bpu*o.eb + o.ipu*o.ei + o.rpu*o.er)/1000, subs = o.dau*(o.prem/100)*o.price;
  $("#ownerTotal").textContent = USD.format(ads+subs); $("#ownerSplit").textContent = "Anuncios "+USD.format(ads)+" · PREMIUM "+USD.format(subs);
  clearTimeout(t._s); t._s = setTimeout(save, 600);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheetRoot").classList.contains("open") && $("#sheetRoot .backdrop[data-act]")) { closeSheet(); return; }
  if (view !== "play-w" || e.ctrlKey || e.metaKey || e.altKey || $("#sheetRoot").classList.contains("open")) return;
  if (e.key === "Enter") { e.preventDefault(); wKey("enter"); }
  else if (e.key === "Backspace") wKey("back");
  else if (/^[a-zñA-ZÑ]$/.test(e.key)) wKey(e.key.toLowerCase());
});
function applySettings(){ document.documentElement.classList.toggle("big", !!S.settings.big); }

/* ---------- Tabs con íconos ---------- */
function buildTabs(){
  const T = [["home","home","Inicio","var(--g)"],["trivias","trivia","Trivias","#74ACDF"],["arcade","arcade","Arcade","var(--y)"],["groups","group","Grupos","var(--r)"],["tito","egg","Tito","var(--b)"]];
  $("#tabs").innerHTML = T.map(([k,ic,l,c]) => `<button data-act="tab:${k}"><span class="ti" style="--c:${c}">${icon(ic)}</span>${l}</button>`).join("");
  $("#gearBtn").innerHTML = icon("gear");
}

/* ---------- Inicio de la app: logo, perfil, ruleta ---------- */
function boot(){
  S = load() || blank(); curDay = today();
  if (!S.tito.dance) S.tito.dance = "funk";
  const MIG = { azuloro:"boca", bandaroja:"river", azulgrana:"sanlorenzo", rojinegra:"milan", blanquinegra:"juventus" };
  if (MIG[S.tito.clothes]) S.tito.clothes = MIG[S.tito.clothes];
  if (S.owned.clothes) S.owned.clothes = S.owned.clothes.map(k => MIG[k] || k);
  if (S.owned.clothes && S.owned.clothes.includes("granate")) { S.owned.clothes = S.owned.clothes.filter(k => k !== "granate"); S.coins += 900; }
  if (S.tito.clothes === "granate") S.tito.clothes = "none";
  if (S.settings.sound == null) S.settings.sound = true; if (S.settings.music == null) S.settings.music = true;
  if (S.streak.last && S.streak.last < addDays(today(), -1)) S.streak.count = 0;
  decayCare();
  const away = Date.now() - (S.lastOpen || 0), returning = !!S.lastOpen; S.lastOpen = Date.now();
  applySettings(); buildTabs(); checkSlots(false); save(); setView("home", { day:today() });
  const sp = $("#splash"), paint = () => { sp.innerHTML = `${brandHTML("xl")}<span class="egg">${titoSVG(S.tito, 110, { mood:"happy", level:level() })}</span>`; };
  let stage = "intro";
  const leave = () => {
    if (stage === "gate" || sp.classList.contains("out")) return; sp.classList.add("out"); setTimeout(() => sp.remove(), 500);
    if (!S.profile.done) openProfile(true);
    else if (dayCounter("wheel").n === 0) setView("ruleta");
    else if (returning && !isPrem() && away > 4*3600e3) showInterstitial("Anuncio de apertura: sale si vuelves después de 4 horas");
  };
  const play = () => { stage = "intro"; sp.classList.remove("gate"); paint(); SND.intro(); setTimeout(leave, matchMedia("(prefers-reduced-motion: reduce)").matches ? 900 : 3200); };
  paint(); SND.unlock();
  setTimeout(() => {
    if (SND.ready() || !SND.wantsMusic()) { play(); return; }
    stage = "gate"; sp.classList.add("gate");
    sp.insertAdjacentHTML("beforeend", `<button class="btn big-cta gate-btn" type="button">¡A JUGAR!</button><span class="gate-note">Sube el volumen</span>`);
  }, 120);
  sp.addEventListener("click", () => { if (stage === "gate") { SND.unlock(); play(); } else leave(); });
  setInterval(() => checkSlots(true), 30000);
  initRemote();
}
boot();

</script>
